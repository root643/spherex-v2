proxy_cache_path /var/cache/nginx/spherex levels=1:2 keys_zone=blink_cache:50m max_size=2g inactive=12h use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Interfaz web estatica
    root /var/www/spherex-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Encuesta HiPS nativa de SPHEREx (Order 0 a 7)
    location /hips/ {
        alias /var/www/spherex-hips/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @dynamic_hips;
    }

    location @dynamic_hips {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
    }

    # API de recortes y traduccion con micro-caching.
    # El backend marca con Cache-Control lo que no debe cachearse (stats, health).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # la primera peticion de una zona descarga y reproyecta FITS: puede tardar
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        proxy_cache blink_cache;
        proxy_cache_valid 200 12h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 120s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Fast-Cache $upstream_cache_status always;
    }
}
